<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>LocalBiz Pro - Brand Video</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a14;
    font-family: 'Arial Black', 'Impact', sans-serif;
  }

  /* ── SCENE WRAPPER ── */
  #scene {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, #12122a 0%, #0a0a14 70%);
  }

  /* ── GRID LINES (subtle) ── */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,144,217,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,144,217,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridFade 1s ease-out forwards;
    opacity: 0;
  }
  @keyframes gridFade { to { opacity: 1; } }

  /* ── GLOW ORBS ── */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    animation: orbIn 2s ease-out forwards;
  }
  .orb-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(74,144,217,0.25) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation-delay: 0.3s;
  }
  .orb-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(100,200,255,0.15) 0%, transparent 70%);
    bottom: -50px; right: 100px;
    animation-delay: 0.6s;
  }
  @keyframes orbIn { to { opacity: 1; } }

  /* ── MAIN CARD ── */
  .card {
    position: relative;
    width: 900px;
    background: linear-gradient(135deg, #111128 0%, #0d0d1e 50%, #111128 100%);
    border: 1px solid rgba(74,144,217,0.3);
    border-radius: 24px;
    padding: 70px 80px 60px;
    box-shadow:
      0 0 60px rgba(74,144,217,0.1),
      0 0 120px rgba(74,144,217,0.05),
      inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0;
    transform: translateY(30px) scale(0.97);
    animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.4s forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* top accent line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 80px; right: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4a90d9, #7fc6ff, #4a90d9, transparent);
    border-radius: 0 0 2px 2px;
    animation: lineGlow 3s ease-in-out 1.5s infinite alternate;
  }
  @keyframes lineGlow {
    from { opacity: 0.6; }
    to   { opacity: 1; box-shadow: 0 0 20px rgba(74,144,217,0.8); }
  }

  .card-inner {
    display: flex;
    align-items: center;
    gap: 60px;
  }

  /* ── LEFT SIDE ── */
  .left { flex: 1; }

  .brand-name {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 0.9;
    color: #f0eacc;
    text-shadow: 0 0 40px rgba(240,234,204,0.15);
    opacity: 0;
    transform: translateX(-20px);
    animation: slideIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
  }
  .brand-name span.pro {
    display: block;
    color: #4a90d9;
    text-shadow: 0 0 30px rgba(74,144,217,0.4);
  }

  .tagline-top {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #4a90d9;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.3s forwards;
  }

  .tagline-main {
    margin-top: 10px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #f0eacc;
    text-transform: uppercase;
    line-height: 1.2;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.5s forwards;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #4a90d9, transparent);
    margin: 24px 0;
    border-radius: 2px;
    opacity: 0;
    animation: fadeUp 0.5s ease-out 1.7s forwards;
  }

  /* ── ICONS ROW ── */
  .icons {
    display: flex;
    gap: 24px;
    margin-top: 8px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.9s forwards;
  }
  .icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .icon-box {
    width: 56px; height: 56px;
    border: 1.5px solid #4a90d9;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(74,144,217,0.08);
    transition: all 0.3s;
  }
  .icon-box svg {
    width: 26px; height: 26px;
    stroke: #4a90d9;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: rgba(240,234,204,0.7);
    text-align: center;
    text-transform: uppercase;
    line-height: 1.3;
  }

  /* ── RIGHT SIDE (photo) ── */
  .right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0;
    animation: slideInRight 0.8s cubic-bezier(0.22,1,0.36,1) 1.1s forwards;
  }
  .photo-wrap {
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 3px solid #4a90d9;
    box-shadow:
      0 0 0 6px rgba(74,144,217,0.1),
      0 0 40px rgba(74,144,217,0.25);
    overflow: hidden;
    position: relative;
  }
  .photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: brightness(1.05);
  }
  .photo-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: conic-gradient(from 0deg, #4a90d9, transparent, #4a90d9) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    animation: rotateSlow 6s linear infinite;
  }
  @keyframes rotateSlow { to { transform: rotate(360deg); } }

  .badge {
    background: linear-gradient(135deg, #4a90d9, #7fc6ff);
    color: #0a0a14;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 8px 18px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(74,144,217,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 2.2s forwards;
  }
  .website {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    color: rgba(240,234,204,0.5);
    text-transform: lowercase;
  }
  .website span { color: #4a90d9; }

  .cta {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #4a90d9;
    text-transform: uppercase;
    border: 1.5px solid rgba(74,144,217,0.5);
    padding: 10px 24px;
    border-radius: 30px;
    background: rgba(74,144,217,0.08);
    animation: pulse 2.5s ease-in-out 3s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,144,217,0); }
    50% { box-shadow: 0 0 0 8px rgba(74,144,217,0.12); }
  }

  /* ── SHARED ANIMS ── */
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── SCAN LINE (cinematic) ── */
  .scan {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(74,144,217,0.6), transparent);
    top: -2px;
    animation: scanDown 2.5s ease-in-out 0.2s forwards;
    opacity: 0;
  }
  @keyframes scanDown {
    0%   { top: 0;    opacity: 0.8; }
    100% { top: 100%; opacity: 0; }
  }

  /* ── CORNER ACCENTS ── */
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    border-color: rgba(74,144,217,0.5);
    border-style: solid;
    opacity: 0;
    animation: cornerFade 0.5s ease-out 0.8s forwards;
  }
  .corner-tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .corner-tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .corner-br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
  @keyframes cornerFade { to { opacity: 1; } }

  /* ── PARTICLE DOTS ── */
  .particles { position: absolute; inset: 0; pointer-events: none; }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(74,144,217,0.6);
    animation: float linear infinite;
    opacity: 0;
  }
</style>
</head>
<body>
<div id="scene">
  <div class="grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="particles" id="particles"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="card">
    <div class="scan"></div>

    <div class="card-inner">
      <!-- LEFT -->
      <div class="left">
        <div class="brand-name">
          LOCALBIZ<span class="pro">PRO</span>
        </div>

        <div class="tagline-top">B-2-B AI Solutions &nbsp;·&nbsp; Backed by AI</div>
        <div class="tagline-main">Smart AI Solutions<br>For Your Business</div>

        <div class="divider"></div>

        <div class="icons">
          <!-- AI Automation -->
          <div class="icon-item">
            <div class="icon-box">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
            </div>
            <div class="icon-label">AI<br>Automation</div>
          </div>
          <!-- Productivity -->
          <div class="icon-item">
            <div class="icon-box">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="3" y="11" width="7" height="10" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/></svg>
            </div>
            <div class="icon-label">Productivity</div>
          </div>
          <!-- Integration -->
          <div class="icon-item">
            <div class="icon-box">
              <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="icon-label">Integration</div>
          </div>
          <!-- Custom Solutions -->
          <div class="icon-item">
            <div class="icon-box">
              <svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
            </div>
            <div class="icon-label">Custom<br>Solutions</div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="photo-wrap">
          <img src="founder-photo.jpeg" alt="LocalBiz Pro Founder"
               style="object-position: center 15%;">
          <div class="photo-ring"></div>
        </div>
        <div class="badge">AI Expert</div>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-bar">
      <div class="website">localbiz<span>pro</span>.ro</div>
      <div class="cta">Free Audit →</div>
    </div>
  </div>
</div>

<script>
// Generate floating particles
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const x = Math.random() * 1080;
  const startY = Math.random() * 1080;
  const dur = 8 + Math.random() * 12;
  const delay = Math.random() * 8;
  const size = 1 + Math.random() * 3;
  p.style.cssText = `
    left:${x}px; top:${startY}px;
    width:${size}px; height:${size}px;
    animation: float ${dur}s ${delay}s linear infinite;
    opacity:0;
  `;
  container.appendChild(p);
}

// Add float keyframe dynamically
const style = document.createElement('style');
style.textContent = `
  @keyframes float {
    0%   { opacity: 0;   transform: translateY(0) scale(1); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { opacity: 0;   transform: translateY(-300px) scale(0.5); }
  }
`;
document.head.appendChild(style);

// Icon hover glow animation (cycle through icons)
const boxes = document.querySelectorAll('.icon-box');
let current = 0;
function glowCycle() {
  boxes.forEach(b => b.style.background = 'rgba(74,144,217,0.08)');
  boxes[current].style.background = 'rgba(74,144,217,0.22)';
  boxes[current].style.boxShadow = '0 0 16px rgba(74,144,217,0.4)';
  setTimeout(() => {
    boxes[current].style.background = 'rgba(74,144,217,0.08)';
    boxes[current].style.boxShadow = '';
    current = (current + 1) % boxes.length;
  }, 600);
}
setTimeout(() => {
  setInterval(glowCycle, 1200);
}, 2500);
</script>
</body>
</html>
